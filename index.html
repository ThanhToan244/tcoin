<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống TCOIN - Xác Nhận Vượt Link</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 100px; background: #f4f4f9; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: inline-block; width: 80%; max-width: 400px; }
        h2 { color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div id="loader" class="loader"></div>
        <h2 id="status">Đang xử lý cộng TCOIN...</h2>
    </div>

    <script>
        const FIREBASE_URL = "https://tcoin-e983b-default-rtdb.firebaseio.com/";

        async function processReward() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            const statusEl = document.getElementById('status');
            const loaderEl = document.getElementById('loader');

            if (!sessionId) {
                statusEl.innerText = "❌ Không tìm thấy mã phiên (Session)!";
                loaderEl.style.display = "none";
                return;
            }

            try {
                // 1. Kiểm tra session trên Firebase
                let res = await fetch(`${FIREBASE_URL}sessions/${sessionId}.json`);
                let sessionData = await res.json();

                if (!sessionData) {
                    statusEl.innerText = "❌ Phiên không tồn tại hoặc đã hết hạn!";
                    loaderEl.style.display = "none";
                    return;
                }

                // Chống spam: Nếu link đã hoàn thành rồi thì chặn ngay
                if (sessionData.status === "completed") {
                    statusEl.innerText = "🚫 Link này đã được sử dụng trước đó rồi!";
                    loaderEl.style.display = "none";
                    return;
                }

                let userId = sessionData.user_id;
                let reward = sessionData.reward;
                let webKey = sessionData.web;

                // 2. Khóa session thành completed
                await fetch(`${FIREBASE_URL}sessions/${sessionId}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: "completed" }),
                    headers: { 'Content-Type': 'application/json' }
                });

                // 3. Lấy dữ liệu user hiện tại từ Firebase để tính toán chính xác
                let userRes = await fetch(`${FIREBASE_URL}users/${userId}.json`);
                let userData = await userRes.json() || {};
                
                let currentTcoin = userData.tcoin || 0;
                let newTcoin = currentTcoin + reward;

                // Lấy ngày hiện tại dạng YYYY-MM-DD theo giờ chuẩn
                let todayStr = new Date().toISOString().split('T')[0];
                
                // Lấy số lượt cũ trong ngày của web đó (nếu chưa có thì mặc định là 0)
                let todayData = userData[todayStr] || {};
                let currentWebCount = todayData[webKey] || 0;
                let newWebCount = currentWebCount + 1;

                // Cập nhật lại số lượt cho đúng ngày và đúng webKey đó
                todayData[webKey] = newWebCount;

                // 4. Gửi dữ liệu cập nhật tổng lên Firebase
                let userUpdateData = {
                    tcoin: newTcoin,
                    [todayStr]: todayData
                };

                await fetch(`${FIREBASE_URL}users/${userId}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(userUpdateData),
                    headers: { 'Content-Type': 'application/json' }
                });

                statusEl.innerText = `🎉 Thành công! Đã cộng +${reward} TCOIN vào tài khoản của bạn.`;
                loaderEl.style.display = "none";

            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ Có lỗi xảy ra trong quá trình xử lý kết nối!";
                loaderEl.style.display = "none";
            }
        }

        processReward();
    </script>
</body>
</html>
